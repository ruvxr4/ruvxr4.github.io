<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =========================================
         1. บังคับทับโค้ดเดิมที่ทำให้เค้กตกขอบ (Force Fix Layout)
         ========================================= */
      body {
        margin: 0 !important;
        padding: 0 !important;
        height: 100vh !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        background-color: #BDE0FE !important; /* พื้นหลังสีฟ้าพาสเทล */
        position: relative !important;
      }
      .container {
        padding-bottom: 0 !important; /* ลบ padding เดิมที่ดันเค้กตกจอ */
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        text-align: center !important;
      }
      .cake-container {
        padding-right: 0 !important; /* ลบ padding เดิมที่ดันเค้กไปซ้าย */
        margin-top: 40px !important;
      }

      /* =========================================
         2. ตกแต่งตัวหนังสือ Happy Birthday
         ========================================= */
      #mainTitle {
        font-size: 48px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
        color: #333;
      }
      #subTitle {
        font-size: 20px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }

      /* =========================================
         3. ตกแต่งปุ่มจดหมาย "click here"
         ========================================= */
      .letter-wrapper {
        position: absolute !important;
        right: 15% !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
        cursor: pointer !important;
        z-index: 10 !important;
      }
      .letter-label {
        background-color: #ffb3c6 !important;
        padding: 12px 24px !important;
        border-radius: 8px !important;
        font-size: 1.2rem !important;
        color: #333 !important;
        font-weight: bold !important;
        box-shadow: 0 4px 6px rgba(0,0,0,0.15) !important;
        transition: transform 0.2s !important;
      }
      .letter-label:hover {
        transform: scale(1.05) !important;
      }
      /* ซ่อนไอคอนลูกศรเดิม (ถ้ายังมีค้างอยู่) */
      .letter-icon {
        display: none !important;
      }

      /* =========================================
         4. ซ่อนและตกแต่ง Popup หน้าต่างจดหมาย (Modal)
         ========================================= */
      .letter-modal-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: rgba(0, 0, 0, 0.6) !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        opacity: 0; /* ซ่อนไว้จนกว่าจะกด */
        pointer-events: none;
        transition: opacity 0.3s ease-in-out;
        z-index: 1000 !important;
      }
      .letter-modal-overlay.active {
        opacity: 1 !important;
        pointer-events: auto !important;
      }
      .letter-paper {
        background-color: #fffaf0 !important;
        width: 80% !important;
        max-width: 800px !important;
        height: 60vh !important;
        display: flex !important;
        flex-direction: row !important;
        border-radius: 12px !important;
        position: relative !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3) !important;
        overflow: hidden !important;
      }
      .letter-close-btn {
        position: absolute !important;
        top: 10px !important;
        right: 15px !important;
        font-size: 32px !important;
        font-weight: bold !important;
        border: none !important;
        background: none !important;
        cursor: pointer !important;
        color: #888 !important;
        z-index: 10 !important;
      }
      .letter-close-btn:hover {
        color: #ff4d4d !important;
      }
      .letter-paper-left {
        flex: 1 !important;
        padding: 40px !important;
        border-right: 2px dashed #ccc !important;
        overflow-y: auto !important;
        display: flex !important;
        align-items: center !important;
      }
      .letter-paper-left p {
        font-family: sans-serif !important;
        font-size: 18px !important;
        line-height: 1.8 !important;
        color: #444 !important;
      }
      .letter-paper-right {
        flex: 1 !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 20px !important;
        background-color: #ffe4e1 !important;
      }
      .letter-photo-frame {
        width: 85% !important;
        height: 85% !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        background: white !important;
        padding: 12px !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15) !important;
        border-radius: 8px !important;
        transform: rotate(2deg) !important;
      }
      .letter-photo-frame img {
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: cover !important;
        border-radius: 4px !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="birthdayText"></div>
      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>
    </div>

    <div class="letter-wrapper" id="letterWrapper">
      <div class="letter-label">click here</div>
    </div>

    <div class="letter-modal-overlay" id="letterModal">
      <div class="letter-paper">
        <button class="letter-close-btn" id="letterCloseBtn" aria-label="close">
          &times;
        </button>
        <div class="letter-paper-left">
          <p>
            สุขสันต์วันเกิดย้อนหลังนะครับ ริต้า ขอให้ริต้าสุขภาพแข็งแรง
            มีตังเยอะๆๆๆๆ ยิ้มสวยๆทุกวัน มีความสุขมากๆๆๆเลยยย
            ริวดีใจมากๆเลยครับที่ได้รู้จักริต้าริวไม่ขอไรมากแค่ขอให้ริต้ายิ้มสวยๆในทุกวันไม่มีเรื่องให้ทุกข์ใจก็พอแล้วครับมีอะไรก็บอกริวได้ริวจะคอยรับฟังอยู่ตรงนี้เสมอๆครับ
          </p>
        </div>
        <div class="letter-paper-right">
          <div class="letter-photo-frame" id="letterPhotoFrame">
             <img src="ritani.jpg" alt="รูปภาพ" />
          </div>
        </div>
      </div>
    </div>

    <script>
      // Read URL params
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Kitty"; 
      let candleCount = parseInt(params.get("candles")) || 4;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");
      birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">กดอ่านจดหมายด้วยนะ 💌</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];
      const CAKE_VISUAL_WIDTH = 35;

      function createCandles(count) {
        cake.innerHTML = "";
        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const rowCount = Math.ceil(count / candlesPerRow);
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");
          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;
          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );
          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

      // === Letter (จดหมาย) open / close ===
      const letterWrapper = document.getElementById("letterWrapper");
      const letterModal = document.getElementById("letterModal");
      const letterCloseBtn = document.getElementById("letterCloseBtn");

      function openLetter() {
        letterModal.classList.add("active");
      }
      function closeLetter() {
        letterModal.classList.remove("active");
      }

      letterWrapper.addEventListener("click", openLetter);
      letterCloseBtn.addEventListener("click", closeLetter);
      letterModal.addEventListener("click", (e) => {
        if (e.target === letterModal) closeLetter();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLetter();
      });

      // === Microphone / Blow Detection ===
      async function startMicDetection() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const source = audioContext.createMediaStreamSource(stream);
          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 512;

          source.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);

          let blown = false;

          function detectBlow() {
            analyser.getByteFrequencyData(dataArray);

            let highFreqSum = 0;
            let lowFreqSum = 0;

            const midpoint = dataArray.length / 2;

            for (let i = 0; i < dataArray.length; i++) {
              if (i < midpoint) {
                lowFreqSum += dataArray[i];
              } else {
                highFreqSum += dataArray[i];
              }
            }

            const highAvg = highFreqSum / (dataArray.length / 2);
            const lowAvg = lowFreqSum / (dataArray.length / 2);

            const ratio = highAvg / (lowAvg + 1);

            const BLOW_RATIO_THRESHOLD = 0.3;

            if (ratio > BLOW_RATIO_THRESHOLD && !blown) {
              blown = true;
              blowOutCandles();
            }

            requestAnimationFrame(detectBlow);
          }

          detectBlow();
        } catch (err) {
          console.error("Mic access error:", err);
        }
      }

      function blowOutCandles() {
        const candles = document.querySelectorAll(".candle");
        candles.forEach((candle) => {
          const delay = Math.random() * 1000;
          setTimeout(() => {
            colors.forEach((color) => {
              if (candle.classList.contains(color)) {
                candle.classList.add("blown");
              }
            });
          }, delay);
        });

        // Update subTitle after short delay
        setTimeout(() => {
          const subTitle = document.getElementById("subTitle");
          subTitle.textContent = `Yayy! Wishing you the happiest birthday ever!! 🎉`;
        }, 1200);
      }

      startMicDetection();
    </script>
  </body>
</html>
