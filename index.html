<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#ffd9e6;
    --bg-bottom:#ffb8d2;
    --frost-1:#ff8fab;
    --frost-2:#ffb3c6;
    --cake-1:#fff1e6;
    --cake-2:#ffe3ec;
    --ink:#7a3b52;
    --ink-soft:#a85d78;
    --paper:#fffaf3;
    --seal:#e0577c;
    --gold:#f6c85f;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow-x:hidden;
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-bottom) 100%);
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    touch-action:pan-y;
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    height:100vh;
    height:100dvh;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    overflow:hidden;
  }

  /* soft glow behind everything */
  .backdrop-glow{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 62%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 55%);
    pointer-events:none;
  }

  /* ---------- top header (title + prompt) ---------- */
  .top-header{
    position:fixed;
    top:max(16px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:0 14px;
    z-index:30;
    pointer-events:none;
  }

  .hbd-title{
    margin:0;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    line-height:1;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(30px, 9vw, 68px);
    opacity:0;
    transform:translateY(-10px) scale(0.96);
    transition:opacity .9s ease, transform .9s cubic-bezier(.34,1.2,.64,1);
    filter:drop-shadow(0 3px 0 rgba(122,59,82,0.16)) drop-shadow(0 8px 16px rgba(122,59,82,0.18));
  }
  .hbd-title.show{ opacity:1; transform:translateY(0) scale(1); }
  .hbd-word{
    display:inline-flex;
    margin:0 10px 4px;
  }
  .hbd-title .c-pink{ color:var(--frost-1); -webkit-text-stroke:1px rgba(122,59,82,0.14); }
  .hbd-title .c-cream{ color:var(--cake-1); -webkit-text-stroke:1px rgba(122,59,82,0.18); }

  .prompt{
    font-family:'Dancing Script',cursive;
    font-weight:700;
    font-size:clamp(20px, 5vw, 30px);
    color:var(--ink);
    text-align:center;
    opacity:0;
    transition:opacity 1s ease;
    text-shadow:0 2px 10px rgba(255,255,255,0.6);
  }
  .prompt.show{ opacity:1; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

  /* ---------- balloons ---------- */
  .balloons{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:5;
  }
  .balloon{
    position:absolute;
    bottom:-220px;
    width:56px;
    height:70px;
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    opacity:0.92;
    animation-name:rise;
    animation-timing-function:ease-in;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 6px 10px rgba(150,60,90,0.18));
  }
  .balloon::before{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    width:1px;
    height:60px;
    background:rgba(122,59,82,0.35);
    transform:translateX(-50%);
  }
  .balloon::after{
    content:"";
    position:absolute;
    left:50%;
    top:-6px;
    width:8px;
    height:10px;
    background:inherit;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform:translateX(-50%);
  }
  @keyframes rise{
    0%{ transform:translateX(0) translateY(0) rotate(0deg); }
    25%{ transform:translateX(18px) translateY(-28vh) rotate(4deg); }
    50%{ transform:translateX(-16px) translateY(-56vh) rotate(-4deg); }
    75%{ transform:translateX(14px) translateY(-84vh) rotate(3deg); }
    100%{ transform:translateX(-8px) translateY(-118vh) rotate(0deg); opacity:0; }
  }
  .b1{ left:6%;  background:#ff9fbe; animation-duration:12s; animation-delay:0.2s; }
  .b2{ left:16%; background:#c9a6ff; animation-duration:14s; animation-delay:2.4s; width:48px; height:60px;}
  .b3{ left:78%; background:#a6e3d4; animation-duration:11s; animation-delay:1.1s; }
  .b4{ left:88%; background:#ffd08a; animation-duration:13s; animation-delay:3.5s; width:50px; height:64px;}
  .b5{ left:60%; background:#ff9fbe; animation-duration:15s; animation-delay:0.8s; width:44px; height:56px;}
  .b6{ left:36%; background:#c9a6ff; animation-duration:12.5s; animation-delay:4.2s; }
  .b7{ left:4%;  background:#a6e3d4; animation-duration:16s; animation-delay:5.5s; width:46px; height:58px;}
  .b8{ left:92%; background:#ff9fbe; animation-duration:13.5s; animation-delay:6.3s; width:40px; height:52px;}

  /* ---------- scene ---------- */
  .scene{
    position:relative;
    width:100%;
    max-width:560px;
    height:min(72dvh, 560px);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
    padding-bottom:5dvh;
    flex-shrink:0;
  }

  .stage{
    position:relative;
    width:280px;
    height:340px;
    transform:scale(1.35);
    transform-origin:center bottom;
  }

  /* ---------- envelope (letter) ---------- */
  .envelope-wrap{
    position:absolute;
    left:50%;
    bottom:18px;
    width:130px;
    height:90px;
    transform:translate(-50%,0) scale(0.9);
    opacity:0;
    transition:opacity .8s ease, transform 1.1s cubic-bezier(.34,1.56,.64,1);
    z-index:6;
    cursor:default;
  }
  .envelope-wrap.appear{ opacity:1; transform:translate(-50%,0) scale(1); }
  .envelope-wrap.slide-out{
    transform:translate(58px,-6px) scale(1);
    z-index:20;
  }
  .envelope-wrap.clickable{ cursor:pointer; }
  .envelope-wrap.clickable .envelope{ animation:invite 1.8s ease-in-out infinite; }
  @keyframes invite{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-5px) rotate(-1.5deg);} }

  .envelope{
    position:relative;
    width:100%;
    height:100%;
  }
  .env-back{
    position:absolute;
    inset:0;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 8px 18px rgba(150,60,90,0.28);
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    border-left:65px solid transparent;
    border-right:65px solid transparent;
    border-top:48px solid #ffd7e3;
    transform-origin:top center;
    transition:transform .5s ease;
    border-radius:4px 4px 0 0;
  }
  .envelope-wrap.opened .env-flap{ transform:rotateX(180deg); }
  .env-body-shade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:60%;
    background:linear-gradient(180deg, rgba(255,178,201,0.35), rgba(255,178,201,0));
    border-radius:0 0 6px 6px;
  }
  .env-seal{
    position:absolute;
    left:50%; top:38px;
    width:26px; height:26px;
    background:var(--seal);
    border-radius:50%;
    transform:translate(-50%,0);
    box-shadow:0 3px 6px rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Dancing Script',cursive;
    color:#ffe3ec;
    font-size:14px;
    font-weight:700;
    z-index:2;
  }

  /* ---------- cake ---------- */
  .cake{
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:220px;
    z-index:8;
  }
  .plate{
    position:absolute;
    bottom:-10px;
    left:50%;
    transform:translateX(-50%);
    width:230px;
    height:16px;
    border-radius:50%;
    background:radial-gradient(ellipse at center, #ffffff 0%, #ffd9e6 70%, transparent 100%);
    box-shadow:0 4px 10px rgba(150,60,90,0.25);
  }
  .layer{
    position:relative;
    margin:0 auto;
    border-radius:14px;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(150,60,90,0.15);
    opacity:0;
    transform:translateY(-260px);
  }
  .layer.drop{
    animation:dropIn .75s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes dropIn{
    0%{ opacity:0; transform:translateY(-260px); }
    70%{ opacity:1; }
    100%{ opacity:1; transform:translateY(0); }
  }
  .layer-3{ width:200px; height:58px; background:linear-gradient(180deg,var(--cake-1),var(--cake-2)); }
  .layer-2{ width:172px; height:52px; background:linear-gradient(180deg,var(--frost-2),var(--frost-1)); margin-top:-4px; }
  .layer-1{ width:142px; height:48px; background:linear-gradient(180deg,var(--cake-1),var(--cake-2)); margin-top:-4px; }
  .layer-top{ width:112px; height:40px; background:linear-gradient(180deg,var(--frost-2),var(--frost-1)); margin-top:-4px; border-radius:14px 14px 40px 40px/14px 14px 20px 20px;}

  .drip{
    position:absolute;
    top:-6px; left:0; right:0;
    height:14px;
    background:inherit;
    border-radius:0 0 40% 40%/0 0 100% 100%;
    -webkit-mask:radial-gradient(circle 7px at 10px 0, transparent 98%, #000 100%) repeat-x;
    mask:radial-gradient(circle 7px at 10px 0, transparent 98%, #000 100%) repeat-x;
    -webkit-mask-size:20px 14px;
    mask-size:20px 14px;
  }

  .candle{
    position:absolute;
    left:50%;
    top:-6px;
    width:6px;
    height:34px;
    background:repeating-linear-gradient(180deg,#ffd08a 0 6px,#fff 6px 12px);
    border-radius:2px;
    transform:translate(-50%,-10px);
    opacity:0;
    box-shadow:0 3px 6px rgba(150,60,90,0.2);
    z-index:9;
  }
  .candle.drop{ animation:candleDrop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes candleDrop{
    0%{ opacity:0; transform:translate(-50%,-120px); }
    70%{ opacity:1; }
    100%{ opacity:1; transform:translate(-50%,-34px); }
  }

  .flame{
    position:absolute;
    left:50%;
    top:-46px;
    width:12px;
    height:18px;
    transform:translate(-50%,0) scale(0);
    background:radial-gradient(ellipse at 50% 70%, var(--gold) 0%, #ff8a3d 55%, transparent 75%);
    border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
    opacity:0;
    z-index:9;
  }
  .flame.lit{
    animation:ignite .6s ease-out forwards, flicker 1.4s ease-in-out .6s infinite;
  }
  @keyframes ignite{
    0%{ opacity:0; transform:translate(-50%,6px) scale(0.2); }
    100%{ opacity:1; transform:translate(-50%,0) scale(1); }
  }
  @keyframes flicker{
    0%,100%{ transform:translate(-50%,0) scale(1) rotate(0deg); filter:brightness(1); }
    30%{ transform:translate(-50%,-1px) scale(1.05) rotate(-3deg); filter:brightness(1.08); }
    60%{ transform:translate(-50%,1px) scale(0.96) rotate(3deg); filter:brightness(0.96); }
  }
  .glow{
    position:absolute;
    left:50%; top:-50px;
    width:40px; height:40px;
    transform:translate(-50%,0);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,200,110,0.55) 0%, transparent 70%);
    opacity:0;
    z-index:8;
    transition:opacity .8s ease;
  }
  .glow.lit{ opacity:1; }

  /* ---------- modal / letter ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(122,59,82,0.45);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    padding-top:max(20px, env(safe-area-inset-top));
    padding-bottom:max(20px, env(safe-area-inset-bottom));
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:50;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .letter-card{
    position:relative;
    width:100%;
    max-width:560px;
    max-height:88vh;
    max-height:88dvh;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 20px 50px rgba(90,30,55,0.35);
    padding:34px 28px 30px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    transform:translateY(24px) scale(0.97);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1);
    background-image:
      linear-gradient(rgba(255,182,205,0.18) 1px, transparent 1px);
    background-size:100% 34px;
  }
  .overlay.show .letter-card{ transform:translateY(0) scale(1); }

  .letter-title{
    font-family:'Dancing Script',cursive;
    font-weight:700;
    font-size:clamp(28px,6vw,38px);
    color:var(--seal);
    margin:0 0 14px;
    text-align:center;
  }
  .letter-text{
    font-size:clamp(15px,3.6vw,17px);
    line-height:1.9;
    color:#5c3247;
    white-space:pre-line;
  }
  .letter-text p{ margin:0 0 20px; }

  .close-btn{
    position:sticky;
    top:0;
    float:right;
    margin:-10px -8px 0 0;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:#ffe3ec;
    color:var(--seal);
    font-size:18px;
    line-height:34px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(150,60,90,0.2);
  }
  .close-btn:active{ transform:scale(0.92); }

  /* small phones (e.g. iPhone SE) */
  @media (max-width:380px){
    .scene{ height:min(64dvh, 460px); padding-bottom:3dvh; }
    .stage{ width:230px; height:290px; transform:scale(1.3); transform-origin:center bottom; }
    .layer-3{ width:172px; }
    .layer-2{ width:148px; }
    .layer-1{ width:122px; }
    .layer-top{ width:96px; }
    .envelope-wrap{ width:104px; height:72px; }
    .env-flap{ border-left-width:52px; border-right-width:52px; border-top-width:38px; }
    .env-seal{ top:30px; width:22px; height:22px; font-size:12px; }
    .cake{ width:190px; }
    .plate{ width:198px; }
  }

  /* short viewports / landscape phones */
  @media (max-height:520px) and (orientation:landscape){
    .top-header{ top:8px; gap:4px; }
    .hbd-title{ font-size:clamp(22px, 6vw, 36px); }
    .prompt{ font-size:clamp(16px,3.4vw,22px); }
    .scene{ height:min(88dvh, 300px); padding-bottom:2dvh; }
    .stage{ transform:scale(0.95); transform-origin:center bottom; }
    .letter-card{ padding:24px 20px 22px; max-height:92dvh; }
  }

  /* iPad portrait and larger phones in between */
  @media (min-width:600px) and (max-height:1000px){
    .scene{ max-width:600px; height:min(60dvh, 560px); }
    .stage{ width:320px; height:390px; transform:scale(1.3); transform-origin:center bottom; }
    .layer-3{ width:228px; }
    .layer-2{ width:196px; }
    .layer-1{ width:162px; }
    .layer-top{ width:128px; }
    .cake{ width:250px; }
    .plate{ width:262px; }
    .envelope-wrap{ width:148px; height:102px; }
    .env-flap{ border-left-width:74px; border-right-width:74px; border-top-width:55px; }
    .env-seal{ width:30px; height:30px; font-size:16px; top:44px; }
    .letter-card{ max-width:640px; padding:44px 40px 36px; }
  }

  /* iPad landscape / wide tablets */
  @media (min-width:900px){
    .scene{ max-width:640px; }
    .prompt{ font-size:clamp(26px, 3.4vw, 40px); }
    .hbd-title{ font-size:clamp(46px, 7vw, 90px); }
    .letter-card{ max-width:680px; }
  }
</style>
</head>
<body>

  <div class="backdrop-glow"></div>

  <div class="top-header" id="topHeader">
    <h1 class="hbd-title" id="hbdTitle" aria-label="Happy Birthday!"></h1>
    <div class="prompt" id="prompt">Click the letter to read 💌</div>
  </div>

  <div class="balloons">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>
    <div class="balloon b6"></div>
    <div class="balloon b7"></div>
    <div class="balloon b8"></div>
  </div>

  <div class="scene">
    <div class="stage">

      <div class="envelope-wrap" id="envelopeWrap">
        <div class="envelope">
          <div class="env-back"></div>
          <div class="env-body-shade"></div>
          <div class="env-flap"></div>
          <div class="env-seal">✦</div>
        </div>
      </div>

      <div class="cake" id="cake">
        <div class="plate"></div>

        <div class="glow" id="glow"></div>
        <div class="flame" id="flame"></div>
        <div class="candle" id="candle"></div>

        <div class="layer layer-top" id="l4"><div class="drip"></div></div>
        <div class="layer layer-1" id="l3"><div class="drip"></div></div>
        <div class="layer layer-2" id="l2"><div class="drip"></div></div>
        <div class="layer layer-3" id="l1"><div class="drip"></div></div>
      </div>

    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="letter-card">
      <button class="close-btn" id="closeBtn" aria-label="Close letter">✕</button>
      <h2 class="letter-title">Happy Birthday</h2>
      <div class="letter-text" id="letterText"></div>
    </div>
  </div>

<script>
  const letterParagraphs = [
    "Hey bb, it's been a while since we last talked. I'm not sure how u r doing, but I hope u r enjoying your university life. U've probably made a lot of friends by now. Please choose ur friends wisely; I don't want u to end up with toxic people like before. When your studies get tough, hang in there. If u r tired, just take a rest and u will feel better.",
    "For ur birthday this year, I wish u nothing but happiness and good things. I don't know if u r seeing someone new already, but I just want to say that I miss you so much. Still, I've always believed that ending things the way we did was for the best.",
    "I was really hurt when you cheated on me so blatantly, but I'm honestly not angry at u at all. Maybe we just misunderstood each other, or maybe it was my fault for not being good enough — causing u to fall out of love and find happiness with someone else instead. Regardless, I still wish u the best. I will always love and care about u.",
    "I'm still keeping our promise that we wouldn't hate each other, even though u probably hate me by now. I wish u the best of luck. If it makes things easier, u can just pretend we never even met."
  ];

  document.getElementById('letterText').innerHTML =
    letterParagraphs.map(p => `<p>${p}</p>`).join('');

  // build "Happy Birthday!" with alternating pink/cream rounded letters
  (function buildTitle(){
    const text = "Happy Birthday!";
    const container = document.getElementById('hbdTitle');
    let letterIndex = 0;
    text.split(' ').forEach(word => {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'hbd-word';
      word.split('').forEach(ch => {
        const letterSpan = document.createElement('span');
        letterSpan.textContent = ch;
        letterSpan.className = letterIndex % 2 === 0 ? 'c-pink' : 'c-cream';
        wordSpan.appendChild(letterSpan);
        letterIndex++;
      });
      container.appendChild(wordSpan);
    });
    setTimeout(() => container.classList.add('show'), 300);
  })();

  const envelopeWrap = document.getElementById('envelopeWrap');
  const cake = document.getElementById('cake');
  const candle = document.getElementById('candle');
  const flame = document.getElementById('flame');
  const glow = document.getElementById('glow');
  const prompt = document.getElementById('prompt');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');

  const layerIds = ['l1','l2','l3','l4'];

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function playSequence(){
    // envelope appears first, tucked under where the cake will build
    await wait(400);
    envelopeWrap.classList.add('appear');

    await wait(700);
    // drop cake layers one by one, bottom to top
    for(const id of layerIds){
      document.getElementById(id).classList.add('drop');
      await wait(650);
    }

    await wait(250);
    candle.classList.add('drop');
    await wait(600);

    flame.classList.add('lit');
    glow.classList.add('lit');
    await wait(900);

    // letter slides out to the side, now clickable
    envelopeWrap.classList.add('slide-out', 'clickable');
    prompt.classList.add('show');
  }

  playSequence();

  function openLetter(){
    if(!envelopeWrap.classList.contains('clickable')) return;
    envelopeWrap.classList.add('opened');
    setTimeout(() => {
      overlay.classList.add('show');
    }, 280);
  }

  function closeLetter(){
    overlay.classList.remove('show');
  }

  envelopeWrap.addEventListener('click', openLetter);
  closeBtn.addEventListener('click', closeLetter);
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeLetter();
  });
</script>
</body>
</html>
